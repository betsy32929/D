<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D夾｜取消動作_三按鈕完成版</title>
  <style>
    :root{
      --bg:#f4f8ff;
      --card:#ffffff;
      --text:#162033;
      --muted:#64748b;
      --line:#dbe7f5;
      --pri:#2563eb;
      --priDark:#1d4ed8;
      --pri2:#38bdf8;
      --soft:#eef6ff;
      --green:#16a34a;
      --red:#dc2626;
      --orange:#f97316;
      --purple:#7c3aed;
      --yellow:#facc15;
      --shadow:0 12px 28px rgba(37,99,235,.12);
      --sidePad:20px;
      --tableFont:13px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;font-size:14px;}
    body{min-width:1540px;overflow-x:auto;}
    button,input,select,textarea{font-family:inherit;font-size:14px;}
    .app{min-width:1540px;padding-bottom:42px;}
    .hero{background:linear-gradient(100deg,#1e40af 0%,#2563eb 45%,#38bdf8 100%);color:#fff;padding:18px var(--sidePad);box-shadow:var(--shadow);}
    .heroTop{display:flex;align-items:center;justify-content:space-between;gap:14px;}
    .titleWrap h1{margin:0;font-size:30px;letter-spacing:3px;font-weight:900;}
    .subText{font-size:12px;opacity:.95;margin-top:4px;}
    .clock{font-weight:900;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:8px 12px;border-radius:999px;white-space:nowrap;}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;}
    .statusChip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:7px 10px;font-size:12px;white-space:nowrap;font-weight:800;}
    .container{padding:var(--sidePad);}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
    .panelTitle{min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(90deg,#dbeafe 0%,#eff6ff 55%,#ffffff 100%);border-bottom:1px solid var(--line);font-weight:900;font-size:17px;position:relative;}
    .panelTitle:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,#2563eb,#38bdf8);}
    .panelTitle span:first-child{padding-left:7px;}
    .panelTitle .meta{font-size:12px;color:var(--muted);font-weight:800;}
    .panelBody{padding:12px 14px;}
    .btn{border:0;border-radius:999px;padding:8px 13px;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08);white-space:nowrap;transition:.12s ease;}
    .btn:hover{filter:brightness(.98);transform:translateY(-1px)}
    .btnPrimary{background:#0f5bd7;color:#fff;}
    .btnBlue{background:#dbeafe;color:#1d4ed8;}
    .btnGreen{background:#dcfce7;color:#15803d;}
    .btnOrange{background:#ffedd5;color:#c2410c;}
    .btnRed{background:#fee2e2;color:#b91c1c;}
    .btnGray{background:#e2e8f0;color:#334155;}
    .btnPurple{background:#ede9fe;color:#6d28d9;}
    .btnMini{font-size:12px;padding:5px 9px;box-shadow:none;}
    .btnTiny{font-size:12px;padding:3px 7px;box-shadow:none;}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--tableFont);}
    th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;vertical-align:middle;}
    th{background:#f1f7ff;color:#0f172a;font-weight:900;position:sticky;top:0;z-index:1;}
    tr:hover td{background:#fbfdff;}
    .rowClick{cursor:pointer;}
    .nowrap{white-space:nowrap;}
    .muted{color:var(--muted);}
    .small{font-size:12px;}
    .tag{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:3px 8px;font-weight:900;font-size:12px;margin:2px;border:1px solid transparent;white-space:nowrap;}
    .tagBlue{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe;}
    .tagGreen{background:#dcfce7;color:#15803d;border-color:#bbf7d0;}
    .tagRed{background:#fee2e2;color:#b91c1c;border-color:#fecaca;}
    .tagOrange{background:#ffedd5;color:#c2410c;border-color:#fed7aa;}
    .tagGray{background:#f1f5f9;color:#475569;border-color:#e2e8f0;}
    .tagPurple{background:#ede9fe;color:#6d28d9;border-color:#ddd6fe;}
    .progressBox{display:flex;align-items:center;justify-content:center;gap:6px;}
    .bar{width:88px;height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;}
    .barInner{height:100%;background:linear-gradient(90deg,#2563eb,#38bdf8);border-radius:999px;}
    .empty{padding:20px;color:var(--muted);text-align:center;font-weight:800;}
    details.settings{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
    details.settings summary{cursor:pointer;padding:12px 14px;background:linear-gradient(90deg,#eff6ff,#ffffff);font-weight:900;list-style:none;}
    details.settings summary::-webkit-details-marker{display:none}
    .settingsBody{padding:12px 14px;border-top:1px solid var(--line);}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .field{display:flex;flex-direction:column;gap:4px;}
    .field label{font-weight:900;color:#334155;font-size:13px;}
    input,select,textarea{border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;background:#fff;color:#0f172a;outline:none;}
    input:focus,select:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.18);}
    textarea{min-height:72px;resize:vertical;line-height:1.55;}
    .inline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
    .modalMask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;}
    .modalMask.show{display:flex;}
    .modal{background:#fff;border-radius:22px;box-shadow:0 25px 80px rgba(15,23,42,.30);width:720px;max-height:92vh;overflow:auto;border:1px solid #dbe4f0;}
    .modalLarge{width:1320px;}
    .modalHeader{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#1d4ed8,#38bdf8);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .modalHeader h2{margin:0;font-size:20px;letter-spacing:1px;}
    .modalBody{padding:14px 16px;}
    .modalFooter{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:flex-end;gap:8px;}
    .closeX{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;width:34px;height:34px;font-size:18px;font-weight:900;cursor:pointer;}
    .sectionBlock{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;background:#fff;}
    .sectionHead{min-height:36px;background:linear-gradient(90deg,#eff6ff,#ffffff);border-bottom:1px solid var(--line);padding:8px 12px;font-weight:900;color:#0f172a;display:flex;align-items:center;justify-content:space-between;position:relative;}
    .sectionHead:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#60a5fa;}
    .sectionHead span:first-child,.sectionHead{padding-left:14px;}
    .sectionContent{padding:12px;}
    .conditionGrid{display:grid;grid-template-columns:1fr 1fr 1.35fr 1.05fr 1.05fr 1.45fr;gap:8px;align-items:end;}
    .dualLine{display:flex;gap:6px;align-items:center;}
    .dualLine input{width:100%;min-width:0;}
    .taskTools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;justify-content:space-between;}
    .seg{display:inline-flex;background:#e2e8f0;padding:3px;border-radius:999px;gap:3px;}
    .seg button{border:0;border-radius:999px;background:transparent;padding:5px 10px;font-weight:900;cursor:pointer;color:#475569;}
    .seg button.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 4px rgba(15,23,42,.10);}
    .toggleBtns{display:flex;justify-content:center;gap:4px;}
    .toggleBtns button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;cursor:pointer;color:#475569;}
    .toggleBtns button.activeAuto{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd;}
    .toggleBtns button.activeReq{background:#dcfce7;color:#15803d;border-color:#86efac;}
    .toggleBtns button.activeNo{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
    .assistantBtns{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;}
    .assistantBtns button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;cursor:pointer;color:#475569;}
    .assistantBtns button.active{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd;box-shadow:0 1px 4px rgba(109,40,217,.16);}
    .doneLine{display:flex;align-items:center;gap:8px;justify-content:flex-start;font-weight:900;}
    .doneCheck{width:18px;height:18px;cursor:pointer;accent-color:#2563eb;}
    .taskTableWrap{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:12px;}
    .rulesWrap{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:12px;}
    .rulesWrap th{font-size:12px;padding:7px 4px;}
    .rulesWrap td{font-size:12px;padding:5px 4px;}
    .switchVX{border:0;border-radius:999px;padding:4px 8px;font-weight:900;cursor:pointer;}
    .switchVX.v{background:#dcfce7;color:#15803d;}
    .switchVX.x{background:#fee2e2;color:#b91c1c;}
    .filterLine{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px;}
    .searchInput{width:300px;}
    .hiddenFile{display:none;}
    .dangerText{color:var(--red);font-weight:900;}
    .okText{color:var(--green);font-weight:900;}
    .caseNameCell{font-weight:900;text-align:left;}
    .condCell{text-align:left;line-height:1.45;max-width:150px;}
    .condEmpty{color:#94a3b8;font-weight:700;}
    .printNote{color:#64748b;font-size:12px;}
    .settingTable input{width:100%;padding:6px 8px;border-radius:8px;}
    .orderBtns{display:flex;gap:3px;justify-content:center;}
    .orderBtns button{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:3px 6px;font-weight:900;cursor:pointer;color:#334155;}
    .tableScroll{overflow:auto;border:1px solid var(--line);border-radius:12px;}

    /* V3 調整：畫面不左右滑動、欄位重新排版、NEW本風格再美化 */
    html,body{width:100%;max-width:100%;overflow-x:hidden;}
    body{min-width:0;overflow-x:hidden;}
    .app{min-width:0;width:100%;max-width:100%;}
    .container{width:100%;max-width:1680px;margin:0 auto;padding:16px;}
    .hero{padding:18px 18px 16px;border-bottom-left-radius:26px;border-bottom-right-radius:26px;}
    .heroTop{align-items:flex-start;}
    .clock{font-size:13px;}
    .toolbar{margin-top:12px;}
    .panel{border-radius:22px;}
    .tableScroll{width:100%;max-width:100%;overflow-x:hidden;}
    .tableScroll table{table-layout:fixed;width:100%;}
    .tableScroll th,.tableScroll td{min-width:0!important;word-break:break-word;overflow-wrap:anywhere;padding:7px 4px;}
    .tableScroll th{font-size:12px;line-height:1.25;}
    .tableScroll td{font-size:12px;line-height:1.35;}
    .filterLine{gap:10px;align-items:center;}
    .filterControls{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;width:100%;}
    .filterControls select{min-width:136px;}
    .searchInput{width:min(360px,100%);}
    .modal{max-width:calc(100vw - 28px);}
    .modalLarge{width:min(1320px,calc(100vw - 28px));}
    .modalMask{overflow:hidden;}
    .modalBody{overflow-x:hidden;}
    input,select,textarea{max-width:100%;}
    textarea{width:100%;min-height:120px;}
    .caseNoteBox{width:100%;min-height:150px;display:block;}
    .conditionGrid{display:none;}
    .conditionStack{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
    .condCard{border:1px solid #dbeafe;background:linear-gradient(180deg,#ffffff,#f8fbff);border-radius:16px;padding:10px;min-height:76px;}
    .condCardWide{grid-column:1 / -1;}
    .condCard label{display:block;font-weight:900;color:#1e3a8a;margin-bottom:7px;}
    .condCard textarea{min-height:80px;}
    .dualLine{gap:8px;}
    .dualLine span{font-weight:900;color:#475569;white-space:nowrap;}
    .taskTools{justify-content:flex-start;background:#f8fbff;border:1px solid #e0ecfb;border-radius:14px;padding:9px 10px;}
    .taskTableWrap{max-height:520px;overflow:auto;}
    .taskTableWrap table{table-layout:fixed;}
    .taskTableWrap th,.taskTableWrap td{word-break:break-word;overflow-wrap:anywhere;}
    .taskNameCell{font-weight:900;text-align:left;display:flex;align-items:center;gap:8px;}
    .vxBadge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900;white-space:nowrap;}
    .vxV{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
    .vxX{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
    .taskRowX td{background:#f8fafc;color:#64748b;}
    .toggleBtns button{min-width:54px;}
    .toggleBtns button:first-child{min-width:92px;}
    .modalFooter{align-items:center;justify-content:space-between;}
    .footerLeft{font-size:12px;color:#64748b;font-weight:900;}
    @media (max-width: 980px){
      .conditionStack{grid-template-columns:1fr;}
      .grid3,.grid4,.grid2{grid-template-columns:1fr;}
      .heroTop{flex-direction:column;}
      .filterLine{flex-direction:column;align-items:stretch;}
      .filterControls{justify-content:flex-start;}
    }

    /* V4 美化與操作調整 */
    .filterLineStack{display:block;}
    .filterGrid{
      display:grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap:8px;
      align-items:end;
      margin-top:9px;
      width:100%;
    }
    .filterGrid label{
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:12px;
      font-weight:900;
      color:#334155;
    }
    .filterGrid input,.filterGrid select{
      width:100%;
      padding:7px 9px;
      border-radius:12px;
      background:#fff;
    }
    .compactConditions .sectionContent{padding:10px;}
    .conditionStack{
      display:grid!important;
      grid-template-columns: 1fr 1fr 1.35fr .9fr;
      gap:8px;
      align-items:stretch;
    }
    .condCard{
      min-height:0!important;
      padding:8px 9px!important;
      border-radius:14px!important;
      background:linear-gradient(180deg,#ffffff 0%,#f7fbff 100%)!important;
      box-shadow:0 2px 10px rgba(37,99,235,.05);
    }
    .condCard label{margin-bottom:5px!important;font-size:13px;}
    .condCard input,.condCard select,.condCard textarea{padding:7px 8px;border-radius:10px;font-size:13px;}
    .condDate{grid-column: span 2;}
    .condTerms{grid-column: span 2;}
    .condTerms textarea{min-height:54px!important;height:54px;}
    .dateDuo{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .dualLine{gap:5px!important;}
    .dualLine span{font-size:12px;}
    .taskTableWrap{
      max-height:none!important;
      overflow:visible!important;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }
    .taskTableWrap table{table-layout:fixed;width:100%;}
    .taskTableWrap th{position:static;top:auto;z-index:auto;background:#eaf4ff;}
    .taskTableWrap th,.taskTableWrap td{padding:7px 6px;line-height:1.35;}
    .taskNamePlain{text-align:left;font-weight:900;color:#172033;}
    .actionCircle{
      width:32px;height:32px;border-radius:999px;border:0;
      font-weight:1000;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.10);
      display:inline-flex;align-items:center;justify-content:center;
    }
    .actionCircle.v{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
    .actionCircle.x{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
    .statusBtns{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
    .statusBtns button{
      border:1px solid #cbd5e1;background:#fff;border-radius:999px;
      padding:4px 9px;font-size:12px;font-weight:900;cursor:pointer;color:#475569;
    }
    .statusBtns .onPending{background:#ffedd5;color:#c2410c;border-color:#fed7aa;}
    .statusBtns .onDone{background:#dcfce7;color:#15803d;border-color:#86efac;}
    .statusBtns .onX{background:#fee2e2;color:#b91c1c;border-color:#fca5a5;}
    .taskRowDone td{background:#f0fdf4;}
    .taskRowX td{background:#f8fafc!important;color:#64748b;}
    .caseCompleteTag{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
    .caseMakingTag{background:#ffedd5;color:#c2410c;border:1px solid #fed7aa;}
    .colTight{white-space:normal;font-size:12px;}
    @media (max-width: 1180px){
      .filterGrid{grid-template-columns:repeat(3,minmax(0,1fr));}
      .conditionStack{grid-template-columns:1fr 1fr;}
      .condDate,.condTerms{grid-column:span 2;}
    }
    @media (max-width: 760px){
      .filterGrid{grid-template-columns:1fr;}
      .conditionStack{grid-template-columns:1fr;}
      .condDate,.condTerms{grid-column:auto;}
      .dateDuo{grid-template-columns:1fr;}
    }

  

    /* V5：變更條件三行緊湊版＋日期錯誤警示 */
    .compactConditions .sectionContent{padding:10px 12px!important;}
    .conditionStack.condition3{
      display:grid!important;
      grid-template-columns:1fr 1.18fr 1.28fr;
      grid-template-areas:
        "price date relist"
        "bottom change key"
        "terms terms terms";
      gap:8px;
      align-items:stretch;
    }
    .conditionStack.condition3 .condCard{
      display:grid;
      grid-template-columns:78px minmax(0,1fr);
      padding:0!important;
      min-height:38px!important;
      border:1px solid #d9e3f0!important;
      border-radius:12px!important;
      overflow:hidden;
      background:#fff!important;
      box-shadow:0 2px 10px rgba(37,99,235,.04);
    }
    .conditionStack.condition3 .condCard label{
      margin:0!important;
      padding:0 7px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-right:1px solid #d9e3f0;
      font-size:13px!important;
      font-weight:900;
      white-space:nowrap;
      text-align:center;
    }
    .conditionStack.condition3 .condBody{
      display:flex;
      align-items:center;
      gap:5px;
      padding:5px 7px;
      min-width:0;
      flex-wrap:nowrap;
    }
    .conditionStack.condition3 .condPrice label{background:#eaf3ff;color:#2878dc;}
    .conditionStack.condition3 .condBottom label{background:#ebf9f0;color:#159452;}
    .conditionStack.condition3 .condDate label{background:#fff3df;color:#df8500;}
    .conditionStack.condition3 .condRelist label{background:#f4eeff;color:#7c3aed;}
    .conditionStack.condition3 .condChange label{background:#fff0f6;color:#db2777;}
    .conditionStack.condition3 .condKey label{background:#e8fbff;color:#0694b5;}
    .conditionStack.condition3 .condTerms label{background:#f1f5f9;color:#64748b;}

    /* V7：固定三行位置，避免被舊版 condDate / condTerms 規則擠位 */
    .conditionStack.condition3 .condPrice{grid-area:price!important;grid-column:auto!important;}
    .conditionStack.condition3 .condDate{grid-area:date!important;grid-column:auto!important;}
    .conditionStack.condition3 .condRelist{grid-area:relist!important;grid-column:auto!important;}
    .conditionStack.condition3 .condBottom{grid-area:bottom!important;grid-column:auto!important;}
    .conditionStack.condition3 .condChange{grid-area:change!important;grid-column:auto!important;}
    .conditionStack.condition3 .condKey{grid-area:key!important;grid-column:auto!important;}
    .conditionStack.condition3 .condTerms{grid-area:terms!important;grid-column:1 / -1!important;grid-template-columns:94px minmax(0,1fr);}
    .conditionStack.condition3 input,.conditionStack.condition3 select{
      height:27px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      padding:3px 7px;
      font-size:13px;
      min-width:0;
      background:#fff;
    }
    .conditionStack.condition3 .num{width:62px;text-align:right;}
    .conditionStack.condition3 .dateInput{width:88px;text-align:center;}
    .conditionStack.condition3 .short{width:78px;}
    .conditionStack.condition3 .growInput{flex:1;min-width:120px;}
    .conditionStack.condition3 .termsInput{flex:1;min-width:220px;}
    .conditionStack.condition3 .miniLabel,.conditionStack.condition3 .unit{
      font-size:12px;
      font-weight:900;
      color:#475569;
      white-space:nowrap;
    }
    .conditionStack.condition3 .relistSelect{width:100%;max-width:100%;}
    .conditionStack.condition3 input{text-align:center;}
    .conditionStack.condition3 .num{text-align:right;}
    .conditionStack.condition3 .condPrice .condBody,
    .conditionStack.condition3 .condBottom .condBody{
      display:grid;
      grid-template-columns:auto 62px auto 62px auto;
      justify-content:start;
      align-items:center;
      column-gap:5px;
    }
    .conditionStack.condition3 .condDate .condBody{
      display:grid;
      grid-template-columns:auto 88px auto 88px;
      justify-content:start;
      align-items:center;
      column-gap:5px;
    }
    .conditionStack.condition3 .condChange .condBody{
      display:grid;

<body>
<div class="app">
  <header class="hero">

      <div class="titleWrap">

      </div>
      <div class="toolbar toolbarMain">
        <button class="btn btnPrimary addObjectBtn" onclick="createBlankCaseAndOpen()">＋ 新增物件</button>
        <button class="btn btnBlue" onclick="exportData()">匯出EXCEL</button>
        <button class="btn btnPurple" onclick="exportJsonData()">匯出JSON</button>
        <button class="btn btnGreen" onclick="document.getElementById('importFile').click()">匯入JSON</button>
        <span class="statusChip" id="saveStatus">已自動存檔</span>
        <div class="clock" id="headerLastUpdate">最後更新時間：—</div>
        <input id="importFile" class="hiddenFile" type="file" accept="application/json,.json" onchange="importData(event)">
      </div>
    </div>
  </header>

  <main class="container">
    <details class="settings syncTopBlock syncLikeProject" id="supabaseSettings">
      <summary>雲端同步設定（設定隱藏）</summary>
      <div class="settingsBody">
        <div class="syncHintLine">這版以 V14 為基底，改成兩台可共用同一份資料。</div>
        <div class="syncProjectRow">
          <input id="sbUrl" placeholder="🔗 URL">
          <input id="sbKey" placeholder="🔑 Key">
          <button class="btn syncConnectBtn" onclick="connectSupabase()">連線</button>
          <button class="btn syncNowBtn" onclick="syncSupabaseNow()">立即同步</button>
          <button class="btn syncStopBtn" onclick="disconnectSupabase()">中斷</button>
        </div>
        <div class="syncProjectStatusLine">
          <span class="statusChip" id="sbStatus">未連線</span>
          <span class="syncMessage" id="sbMessage">尚未連線</span>
        </div>
      </div>
    </details>

    <section class="panel">
      <div class="panelTitle">
        <span>製作中</span>
        <span class="meta" id="makingCount">0 筆</span>
      </div>
      <div class="panelBody">
        <div class="filterLine filterLineStack">
          <div class="filterGrid filterGridMaking">
            <label>項目未做<select id="filterOpenAction" onchange="renderAll()"><option value="">全部</option><option value="__ANY__">任何未做項目</option></select></label>
            <label>單據日期<input id="filterReceiptDate" placeholder="單據日期" oninput="renderAll()"></label>
            <label>單據號碼<input id="filterReceiptNo" placeholder="單據號碼" oninput="renderAll()"></label>
            <label>處理日期<input id="filterProcessDate" placeholder="處理日期" oninput="renderAll()"></label>
            <label>契約編號<input id="filterContractNo" placeholder="契約編號" oninput="renderAll()"></label>
            <label>業務<input id="filterBusiness" placeholder="業務" oninput="renderAll()"></label>
            <label>案名<input id="filterCaseName" placeholder="案名" oninput="renderAll()"></label>
            <div class="filterActionBox"><button class="btn btnGray btnMini" onclick="clearMakingFilters()">清除篩選</button></div>
          </div>
        </div>
        <div class="tableScroll" id="makingList"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panelTitle">
        <span>D夾</span>
        <span class="meta" id="allCount">0 筆</span>
      </div>
      <div class="panelBody">
        <div class="filterLine filterLineStack">
          <div class="filterGrid filterGridCompleted">
            <label>項目<select id="filterDoneAction" onchange="renderAll()"><option value="">全部</option><option value="__ANY__">任何項目</option></select></label>
            <label>單據日期<input id="filterDoneReceiptDate" placeholder="單據日期" oninput="renderAll()"></label>
            <label>單據號碼<input id="filterDoneReceiptNo" placeholder="單據號碼" oninput="renderAll()"></label>
            <label>處理日期<input id="filterDoneProcessDate" placeholder="處理日期" oninput="renderAll()"></label>
            <label>契約編號<input id="filterDoneContractNo" placeholder="契約編號" oninput="renderAll()"></label>
            <label>業務<input id="filterDoneBusiness" placeholder="業務" oninput="renderAll()"></label>
            <label>案名<input id="filterDoneCaseName" placeholder="案名" oninput="renderAll()"></label>
            <div class="filterActionBox"><button class="btn btnGray btnMini" onclick="clearDoneFilters()">清除篩選</button></div>
          </div>
        </div>
        <div class="tableScroll" id="allList"></div>
      </div>
    </section>

    




<details class="settings" id="assistantSettings">

        <div class="inline" style="margin-bottom:10px;">

        <div class="rulesWrap" id="assistantsTable"></div>
      </div>
    </details>

    <details class="settings" id="itemSettings">

          <div class="inline">

        </div>
        <div class="rulesWrap" id="rulesTable"></div>
      </div>
    </details>
  </main>
</div>

              </div>
            </div>

            <div class="condCard condRelist">

            </div>

            <div class="condCard condBottom">
              <label>底價</label>
              <div class="condBody">
                <span class="miniLabel">原</span>
                <input class="editField condField num" data-key="bottomPriceOld">
                <span class="miniLabel">改</span>
                <input class="editField condField num" data-key="bottomPriceNew">

              <div class="condBody">
                <input class="editField condField short" data-key="contractTypeOld" placeholder="原約">

            </div>

            <div class="condCard condKey">
              <label>KEY</label>

                <input class="editField condField growInput" data-key="keyText" placeholder="KEY">

                <input class="editField condField termsInput" data-key="specialTerms" placeholder="輸入特約條款">

          </div>
        </div>
      </div>

      <div class="sectionBlock">
        <div class="sectionHead">
          <span>更新清單</span>
          <span id="editProgressText" class="small muted">—</span>
        </div>
        <div class="sectionContent">

        </div>
      </div>

      <div class="sectionBlock">
        <div class="sectionHead">案件備註</div>
        <div class="sectionContent">
          <textarea rows="3" class="editField caseNoteBox" data-key="note" placeholder="可輸入案件備註"></textarea>
        </div>
      </div>
    </div>
    <div class="modalFooter">
      <div class="inline">
        <button class="btn btnRed" onclick="deleteCurrentCase()">刪除案件</button>
        <button class="btn btnGray" onclick="closeEditModal()">關閉</button>
      </div>
    </div>
  </div>
</div>

function rocYear(d=new Date()){ return d.getFullYear() - 1911; }
function rocDateTime(d=new Date()){
  const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()];
  return `${rocYear(d)}/${d.getMonth()+1}/${d.getDate()} ${week} ${pad(d.getHours())}點${pad(d.getMinutes())}分${pad(d.getSeconds())}秒`;

function parseRocDate(val, opts={}){
  const r = normalizeRocDate(val, opts);
  return r.valid ? r.value : String(val || '').trim();
}
function normalizeRocDate(val, opts={}){
  const original = String(val || '').trim();
  if(!original) return {valid:true, value:''};
  let s = original
    .replace(/[.。-]/g,'/')
    .replace(/[年月]/g,'/')
    .replace(/日/g,'')
    .replace(/\/+/g,'/');
  const m = s.match(/^(\d{1,4})\/(\d{1,2})(?:\/(\d{1,2}))?$/);
  if(!m) return {valid:false, value:original};
  let a = Number(m[1]), b = Number(m[2]), c = m[3] ? Number(m[3]) : null;
  let y, mo, da;
  if(c === null){
    y = rocYear(); mo = a; da = b;
    if(opts.futureAnnual){
      const today = new Date();
      if(mo < today.getMonth()+1 || (mo === today.getMonth()+1 && da < today.getDate())) y += 1;
    }
  }else{
    y = a > 1911 ? a - 1911 : a; mo = b; da = c;
  }
  if(!Number.isInteger(y) || !Number.isInteger(mo) || !Number.isInteger(da)) return {valid:false, value:original};
  if(y < 1 || mo < 1 || mo > 12 || da < 1 || da > 31) return {valid:false, value:original};
  const adYear = y + 1911;
  const d = new Date(adYear, mo - 1, da);
  if(d.getFullYear() !== adYear || d.getMonth() !== mo - 1 || d.getDate() !== da) return {valid:false, value:original};
  return {valid:true, value:`${y}/${mo}/${da}`};
}

  state.assistants = state.assistants.filter(a=>a && a.name).map((a,i)=>({id:a.id||uid('a'), name:String(a.name).trim(), active:a.active !== false}));
  if(!Array.isArray(state.rules) || !state.rules.length) state.rules = cloneRules(DEFAULT_RULES);
  state.rules = state.rules.map((r,i)=>{
    const def = DEFAULT_RULES.find(d=>d.name === r.name) || DEFAULT_RULES[i];
    return Object.assign({}, def || {}, r, {id:r.id || (def && def.id) || uid('r'), name:r.name || (def && def.name) || '未命名項目'});
  });
  if(!Array.isArray(state.cases)) state.cases = [];
  state.cases.forEach(c=>{
    if(c.followMain && !c.mainContractNo) c.mainContractNo = '';
    delete c.followMain;
    if(typeof c.business !== 'string') c.business = '';
    if(!c.tasks || typeof c.tasks !== 'object') c.tasks = {};
    state.rules.forEach(rule=>{

    ensureCaseTasks(c);
  });
}

function ensureCaseTasks(c){
  if(!c.tasks || typeof c.tasks !== 'object') c.tasks = {};

    if(c.tasks[rule.name] && !c.tasks[rule.id]) c.tasks[rule.id] = c.tasks[rule.name];
    if(!c.tasks[rule.id]) c.tasks[rule.id] = {override:'auto', done:false, assistant:'', note:'', updatedAt:''};
    if(!('updatedAt' in c.tasks[rule.id])) c.tasks[rule.id].updatedAt = '';

function taskInfo(c, rule){
  ensureCaseTasks(c);

  const systemRequired = triggers.length > 0;
  const t = c.tasks[rule.id] || {override:'auto', done:false, assistant:'', note:'', updatedAt:''};
  let finalRequired = systemRequired;
  if(t.override === 'required') finalRequired = true;
  if(t.override === 'notRequired') finalRequired = false;
  return {systemRequired, finalRequired, triggers, task:t};
}
function caseStats(c){

  let required=0, done=0, pending=0, x=0, touched=0;

    if(info.finalRequired){
      required++;
      if(info.task.done || info.task.assistant) done++; else pending++;
    }else{
      x++;
    }
    if(info.task && info.task.updatedAt) touched++;
  });
  const complete = required > 0 && done >= required;
  const pct = required ? Math.round((done / required) * 100) : 0;

}

function setTaskFilter(f){ currentTaskFilter = f; renderTaskTable(); }
function touchTask(c, task){ task.updatedAt = nowISO(); c.updatedAt = nowISO(); }
function toggleTaskAction(ruleId){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c);
  const rule = state.rules.find(r=>r.id===ruleId); if(!rule) return;
  const info = taskInfo(c, rule);
  const t = c.tasks[ruleId];
  if(info.finalRequired){
    t.override = 'notRequired';
    t.done = false;
    t.assistant = '';
  }else{
    t.override = 'required';
    t.done = false;
  }
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function setTaskStatus(ruleId, status){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c); const t = c.tasks[ruleId];
  if(status === 'x'){
    t.override = 'notRequired';
    t.done = false;
    t.assistant = '';
  }else if(status === 'done'){
    t.override = 'required';
    t.done = true;
  }else{
    t.override = 'required';
    t.done = false;
    t.assistant = '';
  }
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function setTaskOverride(ruleId, value){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c); const t = c.tasks[ruleId];
  t.override = value; touchTask(c,t);
  const rule = state.rules.find(r=>r.id===ruleId);
  if(rule && !taskInfo(c, rule).finalRequired) t.done = false;
  saveState(); renderTaskTable(); renderAll(false);
}
function setTaskDone(ruleId, checked){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c); const t = c.tasks[ruleId];
  t.done = !!checked; touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function selectTaskAssistant(ruleId, encodedName){
  const c = getCase(currentCaseId); if(!c) return;
  const name = decodeURIComponent(encodedName);
  ensureCaseTasks(c); 
  const rule = state.rules.find(r=>r.id===ruleId);
  const t = c.tasks[ruleId];
  if(t.assistant === name){
    t.assistant = '';
    if(rule && taskInfo(c, rule).finalRequired) t.done = false;
  }else{
    t.override = 'required';
    t.assistant = name;
    t.done = true;
  }
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function setTaskNote(ruleId, value){

  saveState(); renderRulesSettings(); if(currentCaseId) renderTaskTable(); renderAll(false);

function strictDateCandidate(raw){
  const s = String(raw || '').trim().replace(/\s+/g,'');
  if(!s) return true;
  return /^\d{1,4}([\/.。年月-])\d{1,2}(([\/.。月-])\d{1,2}日?)?$/.test(s);
}
function normalizeDateField(el, showWarning=true){
  if(!el) return true;
  const raw = el.value.trim();
  if(!raw){ setDateWarning(el,''); return true; }
  if(!strictDateCandidate(raw)){
    if(showWarning) setDateWarning(el, '日期錯誤，請輸入例：115/4/30 或 4/30');
    return false;
  }
  const r = normalizeRocDate(raw, {futureAnnual: el.dataset.key === 'contractEndNew'});
  if(r.valid){
    el.value = r.value;
    setDateWarning(el,'');
    return true;
  }
  if(showWarning) setDateWarning(el, '日期錯誤，請輸入例：115/4/30 或 4/30');
  return false;
}
function validateVisibleDateFields(showWarning=true){
  let ok = true;
  document.querySelectorAll('#editModalMask .roc-date').forEach(el=>{
    if(!normalizeDateField(el, showWarning)) ok = false;
  });
  const oldEl = document.querySelector('#editModalMask .editField[data-key="contractEndOld"]');

function normalizeDateField(el, showWarning=true){
  if(!el) return true;
  const raw = el.value.trim();
  if(!raw){
    setDateWarning(el,'');
    return true;
  }

  // 日期欄只接受純日期格式，避免 KEY4/3 這種文字被誤判
  const compact = raw.replace(/\s+/g,'');
  if(!/^\d{1,4}([\/.。年月-])\d{1,2}(([\/.。月-])\d{1,2}日?)?$/.test(compact)){
    if(showWarning) setDateWarning(el, '日期錯誤，請輸入例：115/4/30 或 4/30');
    return false;
  }

  const r = normalizeRocDate(compact, {futureAnnual: el.dataset.key === 'contractEndNew'});
  if(r.valid){
    // 不在輸入中即時改值，避免打 4/3 時中途跳成 115/4/33；
    // 只有 onchange / blur 時才正式轉民國日期
    if(showWarning) el.value = r.value;
    setDateWarning(el,'');
    return true;
  }

  if(showWarning) setDateWarning(el, '日期錯誤，請輸入例：115/4/30 或 4/30');
  return false;
}

function validateVisibleDateFields(showWarning=true){

  const newEl = document.querySelector('#editModalMask .editField[data-key="contractEndNew"]');

    const oldHas = !!oldEl.value.trim();

      if(!oldEl.classList.contains('dateInvalid')) setDateWarning(oldEl,'');
      if(!newEl.classList.contains('dateInvalid')) setDateWarning(newEl,'');
    }
  }
  return ok;
}

// ===== V9修正版4 overrides：委託日期前後判斷＋更新清單欄位排序 =====
function rocDateToNumber(v){
  const r = normalizeRocDate(String(v || '').trim(), {futureAnnual:false});
  if(!r.valid || !r.value) return null;
  const p = r.value.split('/').map(Number);
  return (p[0] + 1911) * 10000 + p[1] * 100 + p[2];
}

function validateVisibleDateFields(showWarning=true){
  let ok = true;
  document.querySelectorAll('#editModalMask .roc-date').forEach(el=>{
    if(!normalizeDateField(el, showWarning)) ok = false;
  });

  const oldEl = document.querySelector('#editModalMask .editField[data-key="contractEndOld"]');
  const newEl = document.querySelector('#editModalMask .editField[data-key="contractEndNew"]');

  if(oldEl && newEl){
    const oldHas = !!oldEl.value.trim();
    const newHas = !!newEl.value.trim();

    if(oldHas !== newHas){
      ok = false;
      if(showWarning){
        if(!oldHas) setDateWarning(oldEl, '必填');
        if(!newHas) setDateWarning(newEl, '必填');
      }
    }else if(oldHas && newHas){
      const oldNum = rocDateToNumber(oldEl.value);
      const newNum = rocDateToNumber(newEl.value);

      if(oldNum !== null && newNum !== null){
        if(oldNum >= newNum){
          ok = false;
          if(showWarning){
            setDateWarning(oldEl, '原時間需早於改時間');
            setDateWarning(newEl, '改時間需晚於原時間');
          }
        }else{
          if(!oldEl.classList.contains('dateInvalid')) setDateWarning(oldEl,'');
          if(!newEl.classList.contains('dateInvalid')) setDateWarning(newEl,'');
        }
      }
    }
  }

  return ok;
}

function conditionSummaryHtml(c){
  const active = activeConditions(c);
  const keyText = String(c.keyText || '').trim();
  const termsText = String(c.specialTerms || '').trim();

  const priceText = active.priceChange
    ? `開價：${c.priceOld || '—'}→${c.priceNew || '—'}萬`
    : '開價X';

  const bottomText = active.bottomPriceChange
    ? `底價：${c.bottomPriceOld || '—'}→${c.bottomPriceNew || '—'}萬`
    : '底價X';

  const contractText = active.extendContract
    ? `委託：${c.contractEndOld || '—'}→${c.contractEndNew || '—'}`
    : '委託X';

  const relistText = active.relist
    ? `上架：${c.relistType || '—'}`
    : '上架X';

  const changeText = active.contractChange
    ? `換約：${c.contractTypeOld || '—'}→${c.contractTypeNew || '—'}`
    : '換約X';

  const keySummary = keyText
    ? `KEY：${shortText(keyText, 16)}`
    : 'KEYX';

  const termsSummary = termsText
    ? `特約：${shortText(termsText, 20)}`
    : '特約X';

  const items = [
    {text:priceText, on:active.priceChange},
    {text:bottomText, on:active.bottomPriceChange},
    {text:contractText, on:active.extendContract},
    {text:relistText, on:active.relist, type:active.relist},
    {text:changeText, on:active.contractChange},
    {text:keySummary, on:!!keyText},
    {text:termsSummary, on:!!termsText}
  ];

  return `<span class="summaryLabel">變更條件</span>` + items.map(x=>{
    const cls = x.type ? 'type' : (x.on ? 'on' : 'off');
    return `<span class="summaryChip ${cls}">${esc(x.text)}</span>`;
  }).join('');
}

    const status = info.finalRequired ? ((t.done || t.assistant) ? '完成' : '未做') : 'X';

    if(!shouldShowTaskByFilter(status)) return '';

    const rowClass = !info.finalRequired ? 'taskRowX' : (status === '完成' ? 'taskRowDone' : '');
    const assistantButtons = assistants.length
      ? assistants.map(a=>`<button class="${t.assistant === a.name ? 'active' : ''}" onclick="selectTaskAssistant('${rule.id}','${encodeURIComponent(a.name)}')">${esc(a.name)}</button>`).join('')
      : '<span class="small muted">尚未設定</span>';

    return `<tr class="${rowClass}">
      <td style="width:20%;"><div class="taskNamePlain">${esc(rule.name)}</div></td>
      <td style="width:7%;"><button class="actionCircle ${action==='V'?'v':'x'}" title="點一下切換 V/X" onclick="toggleTaskAction('${rule.id}')">${action}</button></td>
      <td style="width:18%;"><div class="assistantBtns">${assistantButtons}</div></td>
      <td style="width:30%;"><input class="taskNoteInput" value="${esc(t.note || '')}" placeholder="備註" oninput="setTaskNote('${rule.id}', this.value)"></td>
      <td style="width:13%;"><span class="statusPill ${status==='完成'?'done':(status==='X'?'x':'pending')}">${status}</span></td>
      <td style="width:12%;" class="nowrap small muted">${esc(formatSavedTime(t.updatedAt))}</td>
    </tr>`;
  }).join('');

  document.getElementById('taskTable').innerHTML = `
    <div class="conditionSummaryBar">${conditionSummaryHtml(c)}</div>
    <div class="taskFilterBar">
      <button type="button" class="${taskFilterActiveClass('all')}" onclick="setTaskFilter('all')">全部</button>
      <button type="button" class="${taskFilterActiveClass('pending')}" onclick="setTaskFilter('pending')">未做</button>
      <button type="button" class="${taskFilterActiveClass('done')}" onclick="setTaskFilter('done')">完成</button>
      <button type="button" class="${taskFilterActiveClass('x')}" onclick="setTaskFilter('x')">X</button>
    </div>
    <table>
      <thead><tr><th>項目</th><th>動作</th><th>助理操作</th><th>備註</th><th>狀態</th><th>最後更新時間</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">沒有符合的項目</td></tr>'}</tbody>
    </table>`;

  requestAnimationFrame(updateStickyOffsets);
  setTimeout(updateStickyOffsets, 60);
}

async function applySupabasePayload(row, cfg, message='已收到另一台電腦的最新更新。'){
  if(!row || !row.payload) return false;

  const localCases = Array.isArray(state.cases) ? state.cases.length : 0;
  const remoteCases = Array.isArray(row.payload.cases) ? row.payload.cases.length : 0;
  if(localCases > 0 && remoteCases === 0){
    setLastRemoteTime(cfg, row.updated_at || nowISO());
    setSupabaseStatus('已連線','warn');
    setSupabaseMessage('雲端資料為空，已保留本機資料','warn');
    return false;
  }

  try{
    localStorage.setItem('DCLIP_BACKUP_BEFORE_CLOUD_' + Date.now(), JSON.stringify(state));
  }catch(e){}

  sbSuppressAuto = true;
  state = Object.assign(
    {version:'9.0',systemName:'D夾',assistants:[{id:'a1',name:'麗卉',active:true},{id:'a2',name:'紹薇',active:true}],rules:cloneRules(DEFAULT_RULES),cases:[],lastSaved:''},
    row.payload
  );
  migrateState();
  saveState();
  sbSuppressAuto = false;
  setLastRemoteTime(cfg, row.updated_at || nowISO());
  renderAll();
  if(currentCaseId && getCase(currentCaseId)) renderTaskTable();
  setSupabaseStatus('已連線','ok');
  setSupabaseMessage(message,'ok');
  return true;
}
async function syncSupabaseNow(fromConnect=false){
  const cfg = saveSupabaseConfig({connected:true});
  if(!supabaseReady(cfg)) return;

  setSupabaseStatus('已連線','ok');
  setSupabaseMessage('立即同步中...','warn');

  try{
    const row = await fetchSupabaseRemote(cfg);
    const localCases = Array.isArray(state.cases) ? state.cases.length : 0;

    if(!row || !row.payload){
      await uploadSupabaseState(true);
      setSupabaseMessage('雲端無資料，已上傳本機資料','ok');
      return;
    }

    const remoteCases = Array.isArray(row.payload.cases) ? row.payload.cases.length : 0;
    const remoteTime = row.updated_at || '';
    const localTime = state.lastSaved || '';

    if(localCases > 0 && remoteCases === 0){
      await uploadSupabaseState(true);
      setSupabaseMessage('雲端資料為空，已上傳本機資料','ok');
      return;
    }

    if(localCases === 0 && remoteCases > 0){
      await applySupabasePayload(row, cfg, '已收到雲端資料。');
      return;
    }

    if(remoteTime && localTime && new Date(remoteTime).getTime() > new Date(localTime).getTime() + 1000){
      await applySupabasePayload(row, cfg, '已收到另一台電腦的最新更新。');
      return;
    }

    await uploadSupabaseState(true);
    setSupabaseMessage('已完成立即同步','ok');
  }catch(err){
    console.error(err);
    setSupabaseStatus('已連線','warn');
    setSupabaseMessage('立即同步失敗','bad');
    alert('立即同步失敗：\n' + (err.message || err));
  }
}
async function checkSupabaseRemoteUpdates(){
  const cfg = loadSupabaseConfig();
  if(!cfg.connected || !cfg.url || !cfg.key) return;

  try{
    const row = await fetchSupabaseRemote(cfg);
    if(!row || !row.payload || !row.updated_at) return;

    const localCases = Array.isArray(state.cases) ? state.cases.length : 0;
    const remoteCases = Array.isArray(row.payload.cases) ? row.payload.cases.length : 0;
    if(localCases > 0 && remoteCases === 0){
      setLastRemoteTime(cfg, row.updated_at);
      return;
    }

    const lastSeen = getLastRemoteTime(cfg);
    const remoteMs = new Date(row.updated_at).getTime();
    const lastMs = lastSeen ? new Date(lastSeen).getTime() : 0;

    if(remoteMs > lastMs + 1000){
      const localMs = state.lastSaved ? new Date(state.lastSaved).getTime() : 0;
      if(remoteMs > localMs + 1000){
        await applySupabasePayload(row, cfg, '已收到另一台電腦的最新更新。');
      }else{
        setLastRemoteTime(cfg, row.updated_at);
      }
    }
  }catch(err){
    console.warn('remote polling failed', err);
  }
}
let sbPollTimer = null;
function startSupabasePolling(){
  clearInterval(sbPollTimer);
  sbPollTimer = setInterval(checkSupabaseRemoteUpdates, 8000);
}
function queueSupabaseAutoSync(){
  if(sbSuppressAuto) return;
  const cfg = loadSupabaseConfig();
  if(!cfg.connected || !cfg.url || !cfg.key) return;
  clearTimeout(sbAutoTimer);
  sbAutoTimer = setTimeout(()=>uploadSupabaseState(true), 1400);
}


// ===== V31：取消動作 V/X；項目由麗卉／紹薇／無判斷完成 =====
const FIXED_TASK_ASSISTANTS_V31 = ['麗卉','紹薇','無'];
function fixedTaskAssistants(){
  return FIXED_TASK_ASSISTANTS_V31.map((name, idx)=>({id:'fixed'+idx, name, active:true}));
}
function activeAssistants(){
  return fixedTaskAssistants();
}
function ensureFixedAssistantsV31(){
  state.assistants = fixedTaskAssistants();
}
function isTaskDoneV31(task){
  if(!task) return false;
  return !!(task.done || (task.assistant && String(task.assistant).trim()));
}
function migrateState(){
  ensureFixedAssistantsV31();
  if(!Array.isArray(state.rules) || !state.rules.length) state.rules = cloneRules(DEFAULT_RULES);
  state.rules = state.rules
    .filter(r=>r && (r.name || r.id))
    .map((r,i)=>({
      id:r.id || (DEFAULT_RULES[i] && DEFAULT_RULES[i].id) || uid('r'),
      name:String(r.name || (DEFAULT_RULES[i] && DEFAULT_RULES[i].name) || '未命名項目').trim() || '未命名項目'
    }));
  if(!Array.isArray(state.cases)) state.cases = [];
  state.cases.forEach(c=>{
    if(c.followMain && !c.mainContractNo) c.mainContractNo = '';
    delete c.followMain;
    if(typeof c.business !== 'string') c.business = '';
    if(!c.tasks || typeof c.tasks !== 'object') c.tasks = {};
    state.rules.forEach(rule=>{
      if(c.tasks[rule.name] && !c.tasks[rule.id]) c.tasks[rule.id] = c.tasks[rule.name];
    });
    ensureCaseTasks(c);
  });
}
function ensureCaseTasks(c){
  if(!c.tasks || typeof c.tasks !== 'object') c.tasks = {};
  state.rules.forEach(rule=>{
    if(c.tasks[rule.name] && !c.tasks[rule.id]) c.tasks[rule.id] = c.tasks[rule.name];
    if(!c.tasks[rule.id]) c.tasks[rule.id] = {override:'required', done:false, assistant:'', note:'', updatedAt:''};
    if(!('done' in c.tasks[rule.id])) c.tasks[rule.id].done = false;
    if(!('assistant' in c.tasks[rule.id])) c.tasks[rule.id].assistant = '';
    if(!('note' in c.tasks[rule.id])) c.tasks[rule.id].note = '';
    if(!('updatedAt' in c.tasks[rule.id])) c.tasks[rule.id].updatedAt = '';
    c.tasks[rule.id].override = 'required';
  });
}
function taskInfo(c, rule){
  ensureCaseTasks(c);
  const t = c.tasks[rule.id] || {override:'required', done:false, assistant:'', note:'', updatedAt:''};
  return {systemRequired:true, finalRequired:true, triggers:[], task:t};
}
function caseStats(c){
  ensureCaseTasks(c);
  let required = 0, done = 0, pending = 0, x = 0, touched = 0;
  state.rules.forEach(rule=>{
    const t = c.tasks[rule.id];
    required++;
    if(isTaskDoneV31(t)) done++; else pending++;
    if(t && t.updatedAt) touched++;
  });
  const complete = required > 0 && done >= required;
  const pct = required ? Math.round((done / required) * 100) : 0;
  return {required, done, pending, x, touched, complete, pct};
}
function setTaskFilter(f){
  currentTaskFilter = (f === 'done' || f === 'pending') ? f : 'all';
  renderTaskTable();
}
function taskFilterActiveClass(f){
  return currentTaskFilter === f ? 'active' : '';
}
function shouldShowTaskByFilter(status){
  if(currentTaskFilter === 'pending') return status === '未做';
  if(currentTaskFilter === 'done') return status === '完成';
  return true;
}
function selectTaskAssistant(ruleId, encodedName){
  const c = getCase(currentCaseId); if(!c) return;
  const name = decodeURIComponent(encodedName);
  ensureCaseTasks(c);
  const t = c.tasks[ruleId];
  if(!t) return;
  if(t.assistant === name){
    t.assistant = '';
    t.done = false;
  }else{
    t.assistant = name;
    t.done = true;
    t.override = 'required';
  }
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function setTaskStatus(ruleId, status){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c);
  const t = c.tasks[ruleId];
  if(!t) return;
  if(status === 'done'){
    t.done = true;
    if(!t.assistant) t.assistant = '無';
  }else{
    t.done = false;
    t.assistant = '';
  }
  t.override = 'required';
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function toggleTaskAction(ruleId){
  // 動作 V/X 已取消，保留空函式避免舊資料或舊按鈕呼叫出錯。
  return false;
}
function setTaskOverride(ruleId, value){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c);
  const t = c.tasks[ruleId];
  if(!t) return;
  t.override = 'required';
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function setTaskDone(ruleId, checked){
  const c = getCase(currentCaseId); if(!c) return;
  ensureCaseTasks(c);
  const t = c.tasks[ruleId];
  if(!t) return;
  t.done = !!checked;
  if(t.done && !t.assistant) t.assistant = '無';
  if(!t.done) t.assistant = '';
  touchTask(c,t); saveState(); renderTaskTable(); renderAll(false);
}
function taskAssistantButtonsHtml(ruleId, t){
  return fixedTaskAssistants().map(a=>{
    const active = t.assistant === a.name;
    const cls = (active ? 'active ' : '') + (a.name === '無' ? 'noneBtn' : '');
    return `<button type="button" class="${cls.trim()}" onclick="selectTaskAssistant('${ruleId}','${encodeURIComponent(a.name)}')">${esc(a.name)}</button>`;
  }).join('');
}
function renderTaskTable(){
  const c = getCase(currentCaseId);
  if(!c) return;
  ensureCaseTasks(c);
  const stats = caseStats(c);
  const progressEl = document.getElementById('editProgressText');
  if(progressEl) progressEl.textContent = `狀態：未做 ${stats.pending}｜完成 ${stats.done}｜總項目 ${stats.required}`;
  const rows = state.rules.map(rule=>{
    const t = c.tasks[rule.id];
    const done = isTaskDoneV31(t);
    const status = done ? '完成' : '未做';
    if(!shouldShowTaskByFilter(status)) return '';
    const rowClass = done ? 'taskRowDone' : '';
    const assistantButtons = taskAssistantButtonsHtml(rule.id, t);
    return `<tr class="${rowClass}">
      <td style="width:24%;"><div class="taskNamePlain">${esc(rule.name)}</div></td>
      <td style="width:22%;"><div class="assistantBtns">${assistantButtons}</div></td>
      <td style="width:32%;"><input class="taskNoteInput" value="${esc(t.note || '')}" placeholder="備註" oninput="setTaskNote('${rule.id}', this.value)"></td>
      <td style="width:10%;"><span class="statusPill ${done?'done':'pending'}">${status}</span></td>
      <td style="width:12%;" class="nowrap small muted">${esc(formatSavedTime(t.updatedAt))}</td>
    </tr>`;
  }).join('');
  document.getElementById('taskTable').innerHTML = `
    <div class="conditionSummaryBar">${conditionSummaryHtml(c)}</div>
    <div class="taskFilterBar">
      <button type="button" class="${taskFilterActiveClass('all')}" onclick="setTaskFilter('all')">全部</button>
      <button type="button" class="${taskFilterActiveClass('pending')}" onclick="setTaskFilter('pending')">未做</button>
      <button type="button" class="${taskFilterActiveClass('done')}" onclick="setTaskFilter('done')">完成</button>
    </div>
    <table>
      <thead><tr><th>項目</th><th>操作人員</th><th>備註</th><th>狀態</th><th>最後更新時間</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">沒有符合的項目</td></tr>'}</tbody>
    </table>`;
  requestAnimationFrame(updateStickyOffsets);
  setTimeout(updateStickyOffsets, 60);
}
function optionListForActionSelect(labelAny){
  return ['<option value="">全部</option>', `<option value="__ANY__">${labelAny || '任何項目'}</option>`]
    .concat(state.rules.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`));
}
function updateActionFilterOptions(){
  const configs = [
    {id:'filterOpenAction', any:'任何未做項目'},
    {id:'filterDoneAction', any:'任何項目'}
  ];
  configs.forEach(cfg=>{
    const sel = document.getElementById(cfg.id);
    if(!sel) return;
    const current = sel.value;
    sel.innerHTML = optionListForActionSelect(cfg.any).join('');
    if([...sel.options].some(o=>o.value === current)) sel.value = current;
  });
}
function caseHasOpenAction(c, ruleId){
  ensureCaseTasks(c);
  if(ruleId === '__ANY__') return state.rules.some(rule=>!isTaskDoneV31(c.tasks[rule.id]));
  const rule = state.rules.find(r=>r.id === ruleId);
  if(!rule) return true;
  return !isTaskDoneV31(c.tasks[rule.id]);
}
function caseHasAction(c, ruleId){
  ensureCaseTasks(c);
  if(ruleId === '__ANY__') return state.rules.some(rule=>isTaskDoneV31(c.tasks[rule.id]));
  const rule = state.rules.find(r=>r.id === ruleId);
  if(!rule) return true;
  return isTaskDoneV31(c.tasks[rule.id]);
}
function matchMakingFilters(c){
  const receiptDate = getInputValue('filterReceiptDate');
  const receiptNo = getInputValue('filterReceiptNo');
  const processDate = getInputValue('filterProcessDate');
  const contractNo = getInputValue('filterContractNo');
  const business = getInputValue('filterBusiness');
  const caseName = getInputValue('filterCaseName');
  const action = (document.getElementById('filterOpenAction') && document.getElementById('filterOpenAction').value) || '';
  return matchFieldContains(c,'receiptDate',receiptDate)
    && matchFieldContains(c,'receiptNo',receiptNo)
    && matchFieldContains(c,'processDate',processDate)
    && matchFieldContains(c,'contractNo',contractNo)
    && matchFieldContains(c,'business',business)
    && matchFieldContains(c,'caseName',caseName)
    && (!action || caseHasOpenAction(c, action));
}
function matchDoneFilters(c){
  const receiptDate = getInputValue('filterDoneReceiptDate');
  const receiptNo = getInputValue('filterDoneReceiptNo');
  const processDate = getInputValue('filterDoneProcessDate');
  const contractNo = getInputValue('filterDoneContractNo');
  const business = getInputValue('filterDoneBusiness');
  const caseName = getInputValue('filterDoneCaseName');
  const action = (document.getElementById('filterDoneAction') && document.getElementById('filterDoneAction').value) || '';
  return matchFieldContains(c,'receiptDate',receiptDate)
    && matchFieldContains(c,'receiptNo',receiptNo)
    && matchFieldContains(c,'processDate',processDate)
    && matchFieldContains(c,'contractNo',contractNo)
    && matchFieldContains(c,'business',business)
    && matchFieldContains(c,'caseName',caseName)
    && (!action || caseHasAction(c, action));
}
function renderAssistantsSettings(){
  const el = document.getElementById('assistantsTable');
  if(el) el.innerHTML = '<div class="empty">操作人員固定為：麗卉、紹薇、無</div>';
}
function addAssistant(){ alert('這版操作人員固定為：麗卉、紹薇、無'); }
function toggleAssistant(){ return false; }
function renderRulesSettings(){
  const body = (state.rules || []).map((r,idx)=>`<tr>
    <td><div class="orderBtns"><button type="button" onclick="moveRule(${idx},-1)">▲</button><button type="button" onclick="moveRule(${idx},1)">▼</button></div></td>
    <td><input value="${esc(r.name)}" onblur="renameRule('${r.id}', this.value)" onkeydown="if(event.key==='Enter'){this.blur();}"></td>
    <td><button class="btn btnRed btnTiny" type="button" onclick="deleteRuleItem('${r.id}')">刪除</button></td>
  </tr>`).join('') || '<tr><td colspan="3" class="empty">尚未設定項目</td></tr>';
  document.getElementById('rulesTable').innerHTML = `<table class="settingTable">
    <colgroup><col class="simpleOrderCol"><col class="simpleNameCol"><col class="simpleOpsCol"></colgroup>
    <thead><tr><th>排序</th><th>項目名稱</th><th>操作</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}
function addRuleItem(){
  const el = document.getElementById('newRuleName');
  const name = el ? el.value.trim() : '';
  if(!name) return;
  if(state.rules.some(r=>r.name === name)){ alert('已有相同項目名稱'); return; }
  const item = {id:uid('r'), name};
  state.rules.push(item);
  state.cases.forEach(ensureCaseTasks);
  if(el) el.value = '';
  saveState(); renderRulesSettings(); updateActionFilterOptions(); if(currentCaseId) renderTaskTable(); renderAll(false);
}
function renameRule(ruleId, name){
  const r = state.rules.find(x=>x.id===ruleId); if(!r) return;
  name = String(name || '').trim();
  if(!name){ renderRulesSettings(); return; }
  if(state.rules.some(x=>x.id !== ruleId && x.name === name)){ alert('已有相同項目名稱'); renderRulesSettings(); return; }
  r.name = name;
  saveState(); renderRulesSettings(); updateActionFilterOptions(); if(currentCaseId) renderTaskTable(); renderAll(false);
}
function moveRule(idx, delta){
  const next = idx + delta;
  if(next < 0 || next >= state.rules.length) return;
  const tmp = state.rules[idx]; state.rules[idx] = state.rules[next]; state.rules[next] = tmp;
  saveState(); renderRulesSettings(); updateActionFilterOptions(); if(currentCaseId) renderTaskTable(); renderAll(false);
}
function toggleRuleVX(){
  // 項目設定已不使用 V/X。
  return false;
}
function deleteRuleItem(ruleId){
  const r = state.rules.find(x=>x.id===ruleId); if(!r) return;
  if(!confirm('確定刪除項目：「' + r.name + '」？')) return;
  state.rules = state.rules.filter(x=>x.id!==ruleId);
  state.cases.forEach(c=>{ if(c.tasks) delete c.tasks[ruleId]; });
  saveState(); renderRulesSettings(); updateActionFilterOptions(); if(currentCaseId) renderTaskTable(); renderAll(false);
}
function saveRulesFromUI(){
  state.cases.forEach(ensureCaseTasks);
  saveState(); renderAll(); if(currentCaseId) renderTaskTable(); alert('項目設定已儲存');
}
function resetDefaultRules(){
  if(!confirm('確定要恢復預設項目？')) return;
  state.rules = DEFAULT_RULES.map(r=>({id:r.id, name:r.name}));
  state.cases.forEach(ensureCaseTasks);
  saveState(); renderAll(); if(currentCaseId) renderTaskTable();
}
function initTaskModeV31(){
  ensureFixedAssistantsV31();
  const assistantSettings = document.getElementById('assistantSettings');
  if(assistantSettings) assistantSettings.style.display = 'none';
}

function init(){
  loadState();
  initTaskModeV31();
  state.cases.forEach(ensureCaseTasks);
  initSupabasePanel();
  setupDateBlur();
  const mask = document.getElementById('editModalMask');
  if(mask){ mask.addEventListener('mousedown', function(e){ if(e.target === mask) closeEditModal(); }); }
  tickClock();
  renderAll();
  if(!state.lastSaved) saveState();
}
init();
</script>
</body>
