<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D夾｜純資料救援工具</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#fff7ed;color:#172033;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;} 
  .hero{padding:18px 22px;background:linear-gradient(105deg,#ffedd5,#e0f2fe,#fff);border-bottom:1px solid #fed7aa;position:sticky;top:0;z-index:5;box-shadow:0 8px 22px rgba(249,115,22,.1)}
  h1{margin:0;font-size:28px;color:#9a3412;letter-spacing:1px}.sub{margin-top:6px;color:#475569;font-weight:800;line-height:1.55}.wrap{padding:18px;max-width:1440px;margin:0 auto}.notice{background:#fff;border:1px solid #fed7aa;border-radius:16px;padding:12px 14px;line-height:1.7;font-weight:800;color:#9a3412;margin-bottom:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:999px;padding:9px 14px;font-weight:1000;cursor:pointer;box-shadow:0 2px 9px rgba(15,23,42,.09);font-family:inherit}.orange{background:#fb923c;color:#fff}.blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#15803d}.gray{background:#e2e8f0;color:#334155}.red{background:#fee2e2;color:#b91c1c}.purple{background:#ede9fe;color:#6d28d9}.small{font-size:12px;color:#64748b}.card{background:#fff;border:1px solid #fed7aa;border-radius:18px;box-shadow:0 10px 26px rgba(249,115,22,.08);overflow:hidden;margin-bottom:16px}.card h2{margin:0;padding:12px 14px;background:linear-gradient(90deg,#fff7ed,#f0f9ff);border-bottom:1px solid #fed7aa;color:#9a3412;font-size:18px}.body{padding:14px}.tableWrap{overflow:auto;border:1px solid #f1e2d2;border-radius:14px}table{width:100%;border-collapse:separate;border-spacing:0;min-width:1120px}th,td{padding:8px 7px;border-bottom:1px solid #f1e2d2;text-align:center;vertical-align:middle;font-size:13px}th{background:#fff7ed;color:#9a3412;position:sticky;top:0;z-index:1}tbody tr:nth-child(even) td{background:#fffaf5}.key{text-align:left;word-break:break-all;color:#475569;font-size:12px}.strong{font-weight:1000}.ok{color:#15803d;font-weight:1000}.warn{color:#b91c1c;font-weight:1000}.preview{white-space:pre-wrap;max-height:320px;overflow:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;line-height:1.6;font-size:13px}.empty{padding:18px;text-align:center;color:#64748b;font-weight:900}.rowBtns{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}textarea{width:100%;min-height:160px;border:1px solid #cbd5e1;border-radius:12px;padding:10px;font-family:Consolas,"Microsoft JhengHei",monospace}.pill{display:inline-flex;border-radius:999px;padding:4px 9px;background:#f1f5f9;border:1px solid #e2e8f0;font-weight:900;font-size:12px;color:#334155;margin:2px}.fixedBottom{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid #fed7aa;border-radius:999px;padding:8px 12px;box-shadow:0 8px 24px rgba(15,23,42,.18);font-size:12px;font-weight:900;color:#9a3412}
</style>
</head>
<body>
<div class="hero">
  <h1>D夾｜純資料救援工具</h1>
  <div class="sub">這份只讀取瀏覽器本機資料與覆蓋前備份，不會連線同步、不會上傳、不會自動覆蓋雲端。</div>
  <div class="bar">
    <button class="btn orange" id="scanBtn">重新掃描本機資料</button>
    <button class="btn blue" id="downloadAllBtn">下載全部救援包</button>
    <button class="btn purple" id="fetchCloudBtn">只讀取雲端目前資料</button>
  </div>
</div>
<div class="wrap">
  <div class="notice">
    使用方式：先看「案件數」、「最後更新時間」、「5/12 後有更新案件」。看到可疑資料請先按「下載JSON」。確認後再按「還原這份」寫回本機 D夾資料。<br>
    如果下面完全沒有資料，通常代表不是在原本輸入資料的同一台電腦／同一個瀏覽器／同一個網址開啟。若原本是在 GitHub Pages 使用，這份也要放到同一個 GitHub Pages 網址下再開。
  </div>
  <div class="card">
    <h2>本機資料與覆蓋前備份</h2>
    <div class="body">
      <div id="summary" class="small"></div>
      <div id="list" class="tableWrap"></div>
    </div>
  </div>
  <div class="card">
    <h2>預覽 / 雲端只讀結果</h2>
    <div class="body"><div id="preview" class="preview">打開後會自動掃描。</div></div>
  </div>
  <div class="card">
    <h2>手動貼上 JSON 檢查</h2>
    <div class="body">
      <textarea id="manualJson" placeholder="如果你有匯出的 D夾 JSON，可以貼在這裡檢查案件數與最後更新時間"></textarea>
      <div class="bar"><button class="btn green" id="checkManualBtn">檢查貼上的JSON</button><button class="btn orange" id="restoreManualBtn">把貼上的JSON還原到本機</button></div>
    </div>
  </div>
</div>
<div class="fixedBottom" id="status">尚未掃描</div>
<script>
(function(){
'use strict';
const MAIN_KEY='DCLIP_APP_STATE_V1';
const BACKUP_PREFIX='DCLIP_BACKUP_BEFORE_CLOUD_';
const SB_CFG_KEY='DCLIP_SUPABASE_CONFIG_V1';
let items=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeParse(raw){try{return JSON.parse(raw||'null');}catch(e){return null;}}
function pad(n){return String(n).padStart(2,'0');}
function fmt(v){if(!v)return '—'; const d=new Date(v); if(isNaN(d)) return String(v); return `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function rocFileTime(){const d=new Date(); return `${d.getFullYear()-1911}年${d.getMonth()+1}月${d.getDate()}日_${pad(d.getHours())}點${pad(d.getMinutes())}分`;}
function stateCases(st){return st&&Array.isArray(st.cases)?st.cases:[];}
function allTimes(st){const out=[]; if(st&&st.lastSaved) out.push(st.lastSaved); stateCases(st).forEach(c=>{ if(c.updatedAt) out.push(c.updatedAt); if(c.tasks&&typeof c.tasks==='object') Object.values(c.tasks).forEach(t=>{if(t&&t.updatedAt) out.push(t.updatedAt)}); }); return out;}
function maxTime(st){let max=0,val=''; allTimes(st).forEach(t=>{const ms=new Date(t).getTime(); if(!isNaN(ms)&&ms>max){max=ms;val=t;}}); return val || (st&&st.lastSaved) || '';}
function afterMay12(st){const cutoff=new Date('2026-05-12T00:00:00+08:00').getTime(); let count=0; stateCases(st).forEach(c=>{let hit=false; if(c.updatedAt){const ms=new Date(c.updatedAt).getTime(); if(!isNaN(ms)&&ms>=cutoff) hit=true;} if(c.tasks&&typeof c.tasks==='object') Object.values(c.tasks).forEach(t=>{const ms=new Date((t&&t.updatedAt)||'').getTime(); if(!isNaN(ms)&&ms>=cutoff) hit=true;}); if(hit) count++;}); return count;}
function backupTime(key){if(!key.startsWith(BACKUP_PREFIX)) return ''; const n=Number(key.slice(BACKUP_PREFIX.length)); return n?new Date(n).toISOString():'';}
function describe(raw,key,type){const st=safeParse(raw); const cases=stateCases(st); return {key,type,raw,state:st,valid:!!(st&&Array.isArray(st.cases)),cases:cases.length,rules:st&&Array.isArray(st.rules)?st.rules.length:0,lastSaved:st&&st.lastSaved?st.lastSaved:'',maxTime:maxTime(st),backupTime:backupTime(key),after:afterMay12(st)};}
function scan(){items=[]; let err=''; try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i); if(key===MAIN_KEY || key.startsWith(BACKUP_PREFIX)){items.push(describe(localStorage.getItem(key)||'',key,key===MAIN_KEY?'目前本機資料':'雲端覆蓋前備份'));}}}catch(e){err=e.message||String(e);} items.sort((a,b)=>{if(b.cases!==a.cases)return b.cases-a.cases; const bm=new Date(b.maxTime||b.backupTime||0).getTime()||0; const am=new Date(a.maxTime||a.backupTime||0).getTime()||0; return bm-am;}); render(err);}
function render(err){$('status').textContent=`已掃描：${items.length} 份`; $('summary').innerHTML=`<span class="pill">找到 ${items.length} 份</span><span class="pill">主資料鍵：${MAIN_KEY}</span><span class="pill">備份鍵：${BACKUP_PREFIX}*</span>`+(err?` <span class="pill warn">localStorage讀取錯誤：${esc(err)}</span>`:''); if(!items.length){$('list').innerHTML='<div class="empty">目前找不到 D夾本機資料或覆蓋前備份。請確認開啟位置是否和原本操作資料的位置相同。</div>'; return;} const rows=items.map((it,i)=>`<tr><td class="strong">${i+1}</td><td>${esc(it.type)}</td><td class="key">${esc(it.key)}</td><td class="strong">${it.cases}</td><td>${it.rules}</td><td>${fmt(it.lastSaved)}</td><td>${fmt(it.maxTime||it.backupTime)}</td><td class="${it.after?'ok':'warn'}">${it.after}</td><td><div class="rowBtns"><button class="btn blue" data-act="download" data-i="${i}">下載JSON</button><button class="btn green" data-act="preview" data-i="${i}">預覽</button><button class="btn orange" data-act="restore" data-i="${i}">還原這份</button></div></td></tr>`).join(''); $('list').innerHTML=`<table><thead><tr><th>#</th><th>類型</th><th>儲存鍵</th><th>案件數</th><th>項目數</th><th>本機最後存檔</th><th>可用最後時間</th><th>5/12後有更新案件</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;}
function downloadObj(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);}
function previewItem(i){const it=items[i]; if(!it){return;} const cases=stateCases(it.state); const lines=cases.slice(0,80).map((c,idx)=>`${idx+1}. ${c.caseName||'未命名案件'}｜單據:${c.receiptDate||'—'}｜契約:${c.contractNo||'—'}｜業務:${c.business||'—'}｜更新:${fmt(c.updatedAt||'')}`); $('preview').textContent=`${it.type}\n案件：${it.cases}｜項目：${it.rules}｜5/12後有更新：${it.after}\n最後時間：${fmt(it.maxTime||it.backupTime)}\n儲存鍵：${it.key}\n\n`+(lines.join('\n')||'沒有案件資料');}
function restoreItem(i){const it=items[i]; if(!it||!it.valid){alert('這份資料格式不完整，不能還原。');return;} if(!confirm(`確定還原這份？\n\n類型：${it.type}\n案件數：${it.cases}\n最後時間：${fmt(it.maxTime||it.backupTime)}\n\n建議先按「下載JSON」備份。`)) return; localStorage.setItem(MAIN_KEY, JSON.stringify(it.state)); alert('已還原到本機。請打開原本 D夾檢查資料；先不要立即同步。'); scan();}
function downloadAll(){const pkg={exportedAt:new Date().toISOString(),mainKey:MAIN_KEY,backupPrefix:BACKUP_PREFIX,items:items.map(x=>({key:x.key,type:x.type,state:x.state,raw:x.raw,cases:x.cases,lastTime:x.maxTime||x.backupTime,afterMay12:x.after}))}; downloadObj(pkg,`D夾_全部救援包_${rocFileTime()}.json`);}
async function fetchCloud(){let cfg=safeParse(localStorage.getItem(SB_CFG_KEY)||'{}')||{}; if(!cfg.url||!cfg.key){$('preview').textContent='找不到 Supabase 設定。若你原本沒有在這個瀏覽器設定 URL/Key，這裡無法讀雲端。'; return;} const workspace=cfg.workspace||'dclip-main'; const url=String(cfg.url).replace(/\/+$/,'')+`/rest/v1/dclip_state?workspace_key=eq.${encodeURIComponent(workspace)}&select=payload,updated_at&limit=1`; $('preview').textContent='正在只讀雲端資料，不會上傳、不會覆蓋...'; try{const res=await fetch(url,{method:'GET',headers:{apikey:cfg.key,Authorization:`Bearer ${cfg.key}`,'Content-Type':'application/json'}}); if(!res.ok) throw new Error(await res.text()||res.statusText); const rows=await res.json(); if(!rows||!rows.length||!rows[0].payload){$('preview').textContent='雲端目前沒有讀到資料。';return;} const it=describe(JSON.stringify(rows[0].payload),'Supabase:'+workspace,'雲端目前資料（只讀）'); it.cloudUpdatedAt=rows[0].updated_at; $('preview').textContent=`雲端目前資料（只讀）\nWorkspace：${workspace}\n案件：${it.cases}\n5/12後有更新：${it.after}\n雲端updated_at：${fmt(rows[0].updated_at)}\n資料內最後時間：${fmt(it.maxTime)}\n\n已自動下載一份雲端JSON，方便你備份。`; downloadObj(rows[0].payload,`D夾_雲端只讀備份_案件${it.cases}_${rocFileTime()}.json`);}catch(e){$('preview').textContent='讀取雲端失敗：'+(e.message||e);}}
function checkManual(){const st=safeParse($('manualJson').value.trim()); const it=describe(JSON.stringify(st||{}),'manual','手動貼上'); $('preview').textContent=`手動JSON檢查\n有效：${it.valid?'是':'否'}\n案件：${it.cases}\n項目：${it.rules}\n5/12後有更新：${it.after}\n最後時間：${fmt(it.maxTime)}`;}
function restoreManual(){const st=safeParse($('manualJson').value.trim()); if(!st||!Array.isArray(st.cases)){alert('貼上的 JSON 不是有效 D夾資料。');return;} const it=describe(JSON.stringify(st),'manual','手動貼上'); if(!confirm(`確定把貼上的 JSON 還原到本機？\n案件數：${it.cases}\n最後時間：${fmt(it.maxTime)}`)) return; localStorage.setItem(MAIN_KEY, JSON.stringify(st)); alert('已還原到本機。請打開原本 D夾檢查資料；先不要立即同步。'); scan();}
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-act]'); if(!b)return; const i=Number(b.dataset.i); if(b.dataset.act==='download') downloadObj(items[i].state||{},`D夾救援_${items[i].type}_案件${items[i].cases}_${rocFileTime()}.json`); if(b.dataset.act==='preview') previewItem(i); if(b.dataset.act==='restore') restoreItem(i);});
$('scanBtn').addEventListener('click',scan); $('downloadAllBtn').addEventListener('click',downloadAll); $('fetchCloudBtn').addEventListener('click',fetchCloud); $('checkManualBtn').addEventListener('click',checkManual); $('restoreManualBtn').addEventListener('click',restoreManual);
scan(); if(items[0]) previewItem(0);
})();
</script>
</body>
</html>
